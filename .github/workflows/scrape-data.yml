name: Validate Data Generation

on:
  workflow_dispatch:
  schedule:
    - cron: '53 3 * * *'

env:
  PYTHON_VERSION: '3.12'
  ORACLE_FILE_ID: '1hnpbrUpBMS1TZI7IovfpKeZfWJH1Aptm'
  ORACLE_CSV_PATH: tools/scraper/data/raw/oracles_elixir/2026/2026_LoL_esports_match_data_from_OraclesElixir.csv
  ORACLE_CACHE_MAX_AGE_SECONDS: '604800'
  SOLO_OUTPUT_ROOT: apps/web/public/data
  TEAMPLAY_OUTPUT_ROOT: apps/web/public/data/teamplay
  DATA_REGIONS: 'na lan las'
  DATA_TIERS: 'bronze silver gold_plus platinum_plus emerald_plus diamond_plus d2_plus master_plus'
  DATA_WINDOWS: 'current 7d 14d'
  DATA_LANES: 'top jungle middle bottom support'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            tools/scraper/pyproject.toml
            tools/scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e tools/scraper "gdown==6.1.0"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore Oracle's Elixir CSV cache
        uses: actions/cache@v4
        with:
          path: tools/scraper/data/raw/oracles_elixir/2026
          key: oracle-elixir-2026-${{ github.run_id }}
          restore-keys: |
            oracle-elixir-2026-

      - name: Download Oracle's Elixir CSV
        run: |
          set -uo pipefail

          mkdir -p "$(dirname "$ORACLE_CSV_PATH")"
          tmp_path="${ORACLE_CSV_PATH}.download"
          fetched_at_path="${ORACLE_CSV_PATH}.fetched_at"
          rm -f "$tmp_path"
          download_ok=false

          if gdown "https://drive.google.com/file/d/${ORACLE_FILE_ID}/view?usp=drive_link" -O "$tmp_path"; then
            if [[ -s "$tmp_path" ]] \
              && head -n 1 "$tmp_path" | grep -q 'gameid' \
              && head -n 1 "$tmp_path" | grep -q 'league'; then
              mv "$tmp_path" "$ORACLE_CSV_PATH"
              date -u +%s > "$fetched_at_path"
              download_ok=true
              echo "Downloaded a fresh Oracle's Elixir CSV."
            else
              echo "::warning::Fresh Oracle CSV download did not pass the dataset sanity check."
              rm -f "$tmp_path"
            fi
          else
            echo "::warning::Fresh Oracle CSV download failed; checking the most recent GitHub Actions cache."
            rm -f "$tmp_path"
          fi

          if [[ "$download_ok" != "true" ]]; then
            if [[ ! -s "$ORACLE_CSV_PATH" || ! -s "$fetched_at_path" ]]; then
              echo "No usable cached Oracle CSV is available." >&2
              exit 1
            fi

            fetched_at="$(cat "$fetched_at_path")"
            if ! [[ "$fetched_at" =~ ^[0-9]+$ ]]; then
              echo "Cached Oracle CSV has invalid freshness metadata." >&2
              exit 1
            fi

            now="$(date -u +%s)"
            cache_age=$((now - fetched_at))
            if (( cache_age > ORACLE_CACHE_MAX_AGE_SECONDS )); then
              echo "Cached Oracle CSV is too old (${cache_age}s; max ${ORACLE_CACHE_MAX_AGE_SECONDS}s)." >&2
              exit 1
            fi

            if ! head -n 1 "$ORACLE_CSV_PATH" | grep -q 'gameid' \
              || ! head -n 1 "$ORACLE_CSV_PATH" | grep -q 'league'; then
              echo "Cached Oracle CSV failed the dataset sanity check." >&2
              exit 1
            fi

            echo "::warning::Using cached Oracle CSV (${cache_age}s old) because the fresh Google Drive download failed."
          fi

      - name: Generate Solo Queue datasets
        run: |
          python -m loltee_scraper.run_matrix \
            --output-root "$SOLO_OUTPUT_ROOT" \
            --regions $DATA_REGIONS \
            --tiers $DATA_TIERS \
            --windows $DATA_WINDOWS \
            --lanes $DATA_LANES \
            --fail-fast

      - name: Generate Teamplay datasets
        run: |
          python -m loltee_scraper.build_teamplay \
            --oe-csv "$ORACLE_CSV_PATH" \
            --solo-root "$SOLO_OUTPUT_ROOT" \
            --output-root "$TEAMPLAY_OUTPUT_ROOT" \
            --regions $DATA_REGIONS \
            --tiers $DATA_TIERS \
            --windows $DATA_WINDOWS \
            --fail-fast

      - name: Upload generated data artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-data-preview
          path: apps/web/public/data
          retention-days: 7
