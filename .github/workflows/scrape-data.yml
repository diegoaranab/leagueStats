name: Validate Data Generation

on:
  workflow_dispatch:
  schedule:
    - cron: '53 3 * * *'

env:
  PYTHON_VERSION: '3.12'
  ORACLE_FILE_ID: '1hnpbrUpBMS1TZI7IovfpKeZfWJH1Aptm'
  ORACLE_CSV_PATH: tools/scraper/data/raw/oracles_elixir/2026/2026_LoL_esports_match_data_from_OraclesElixir.csv
  ORACLE_CACHE_MAX_AGE_SECONDS: '604800'
  PUBLISHED_SITE_BASE_URL: 'https://diegoaranab.github.io/leagueStats/'
  SOLO_OUTPUT_ROOT: apps/web/public/data
  TEAMPLAY_OUTPUT_ROOT: apps/web/public/data/teamplay
  DATA_REGIONS: 'na lan las'
  DATA_TIERS: 'bronze silver gold_plus platinum_plus emerald_plus diamond_plus d2_plus master_plus'
  DATA_WINDOWS: 'current 7d 14d'
  DATA_LANES: 'top jungle middle bottom support'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            tools/scraper/pyproject.toml
            tools/scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e tools/scraper "gdown==6.1.0"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore last published Teamplay fallback
        id: published_teamplay
        continue-on-error: true
        run: |
          python -m loltee_scraper.restore_published_teamplay \
            --site-base-url "$PUBLISHED_SITE_BASE_URL" \
            --output-root "$SOLO_OUTPUT_ROOT" \
            --regions $DATA_REGIONS \
            --tiers $DATA_TIERS \
            --windows $DATA_WINDOWS

      - name: Restore Oracle's Elixir CSV cache
        uses: actions/cache/restore@v4
        with:
          path: tools/scraper/data/raw/oracles_elixir/2026
          key: oracle-elixir-2026-${{ github.run_id }}
          restore-keys: |
            oracle-elixir-2026-

      - name: Download Oracle's Elixir CSV
        id: oracle_download
        run: |
          set -uo pipefail

          mkdir -p "$(dirname "$ORACLE_CSV_PATH")"
          tmp_path="${ORACLE_CSV_PATH}.download"
          fetched_at_path="${ORACLE_CSV_PATH}.fetched_at"
          cookie_jar="${RUNNER_TEMP}/oracle-gdrive-cookies.txt"
          browser_user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          fresh_download=false
          oracle_available=false
          oracle_source=none
          rm -f "$tmp_path" "$cookie_jar"

          valid_csv() {
            [[ -s "$1" ]] \
              && head -n 1 "$1" | grep -q 'gameid' \
              && head -n 1 "$1" | grep -q 'league'
          }

          accept_fresh_download() {
            if valid_csv "$tmp_path"; then
              mv "$tmp_path" "$ORACLE_CSV_PATH"
              date -u +%s > "$fetched_at_path"
              fresh_download=true
              oracle_available=true
              oracle_source=fresh
              return 0
            fi

            rm -f "$tmp_path"
            return 1
          }

          echo "Trying the direct Google Drive download URL that browsers use."
          if curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            --user-agent "$browser_user_agent" \
            --cookie "$cookie_jar" --cookie-jar "$cookie_jar" \
            "https://drive.google.com/uc?id=${ORACLE_FILE_ID}&export=download&confirm=t" \
            --output "$tmp_path"; then
            if accept_fresh_download; then
              echo "Downloaded a fresh Oracle's Elixir CSV through the direct browser URL."
            else
              echo "::warning::The direct browser URL returned a response, but it was not the Oracle CSV."
            fi
          else
            rm -f "$tmp_path"
            echo "::warning::The direct browser URL download failed."
          fi

          if [[ "$fresh_download" != "true" ]]; then
            echo "Trying the Google Drive user-content download endpoint."
            if curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --connect-timeout 20 --max-time 180 \
              --user-agent "$browser_user_agent" \
              --cookie "$cookie_jar" --cookie-jar "$cookie_jar" \
              "https://drive.usercontent.google.com/download?id=${ORACLE_FILE_ID}&export=download&confirm=t" \
              --output "$tmp_path"; then
              if accept_fresh_download; then
                echo "Downloaded a fresh Oracle's Elixir CSV through drive.usercontent.google.com."
              else
                echo "::warning::The user-content endpoint returned a response, but it was not the Oracle CSV."
              fi
            else
              rm -f "$tmp_path"
              echo "::warning::The user-content endpoint download failed."
            fi
          fi

          if [[ "$fresh_download" != "true" ]]; then
            echo "Trying gdown as a final fresh-download method."
            if gdown \
              "https://drive.google.com/uc?id=${ORACLE_FILE_ID}" \
              --user-agent "$browser_user_agent" \
              -O "$tmp_path"; then
              if accept_fresh_download; then
                echo "Downloaded a fresh Oracle's Elixir CSV with gdown."
              else
                echo "::warning::gdown returned a response, but it was not the Oracle CSV."
              fi
            else
              rm -f "$tmp_path"
              echo "::warning::gdown could not download a fresh Oracle CSV."
            fi
          fi

          if [[ "$oracle_available" != "true" ]]; then
            echo "::warning::All fresh Oracle CSV download methods failed; checking the most recent raw-data cache."

            if [[ -s "$ORACLE_CSV_PATH" && -s "$fetched_at_path" ]]; then
              fetched_at="$(cat "$fetched_at_path")"
              if [[ "$fetched_at" =~ ^[0-9]+$ ]]; then
                now="$(date -u +%s)"
                cache_age=$((now - fetched_at))
                if (( cache_age <= ORACLE_CACHE_MAX_AGE_SECONDS )) && valid_csv "$ORACLE_CSV_PATH"; then
                  oracle_available=true
                  oracle_source=cache
                  echo "::warning::Using cached Oracle CSV (${cache_age}s old)."
                else
                  echo "::warning::The cached Oracle CSV is stale or invalid and will not be used."
                fi
              else
                echo "::warning::The cached Oracle CSV has invalid freshness metadata and will not be used."
              fi
            else
              echo "::warning::No usable cached Oracle CSV is available."
            fi
          fi

          echo "fresh=${fresh_download}" >> "$GITHUB_OUTPUT"
          echo "available=${oracle_available}" >> "$GITHUB_OUTPUT"
          echo "source=${oracle_source}" >> "$GITHUB_OUTPUT"

      - name: Save fresh Oracle's Elixir CSV cache
        if: steps.oracle_download.outputs.fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/scraper/data/raw/oracles_elixir/2026
          key: oracle-elixir-2026-${{ github.run_id }}

      - name: Ensure a Teamplay source is available
        if: steps.oracle_download.outputs.available != 'true' && steps.published_teamplay.outcome != 'success'
        run: |
          echo "Neither a fresh/cached Oracle CSV nor the last published Teamplay datasets are available." >&2
          exit 1

      - name: Report Teamplay fallback mode
        if: steps.oracle_download.outputs.available != 'true' && steps.published_teamplay.outcome == 'success'
        run: |
          echo "::warning::Oracle's Elixir is unavailable to this GitHub runner. Reusing the last successfully published Teamplay datasets while refreshing Solo Queue data."

      - name: Generate Solo Queue datasets
        run: |
          python -m loltee_scraper.run_matrix \
            --output-root "$SOLO_OUTPUT_ROOT" \
            --regions $DATA_REGIONS \
            --tiers $DATA_TIERS \
            --windows $DATA_WINDOWS \
            --lanes $DATA_LANES \
            --fail-fast

      - name: Generate Teamplay datasets
        if: steps.oracle_download.outputs.available == 'true'
        run: |
          python -m loltee_scraper.build_teamplay \
            --oe-csv "$ORACLE_CSV_PATH" \
            --solo-root "$SOLO_OUTPUT_ROOT" \
            --output-root "$TEAMPLAY_OUTPUT_ROOT" \
            --regions $DATA_REGIONS \
            --tiers $DATA_TIERS \
            --windows $DATA_WINDOWS \
            --fail-fast

      - name: Verify Teamplay datasets exist
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["TEAMPLAY_OUTPUT_ROOT"])
          regions = os.environ["DATA_REGIONS"].split()
          tiers = os.environ["DATA_TIERS"].split()
          windows = os.environ["DATA_WINDOWS"].split()
          missing = [
              str(root / region / tier / f"{window}.json")
              for region in regions
              for tier in tiers
              for window in windows
              if not (root / region / tier / f"{window}.json").is_file()
          ]
          if missing:
              raise SystemExit(f"Missing {len(missing)} Teamplay datasets; examples={missing[:5]}")
          print(f"Verified {len(regions) * len(tiers) * len(windows)} Teamplay datasets.")
          PY

      - name: Upload generated data artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-data-preview
          path: apps/web/public/data
          retention-days: 7
