name: Validate Data Generation

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  ORACLE_FILE_ID: '1hnpbrUpBMS1TZI7IovfpKeZfWJH1Aptm'
  ORACLE_CSV_PATH: tools/scraper/data/raw/oracles_elixir/2026/2026_LoL_esports_match_data_from_OraclesElixir.csv
  ORACLE_CACHE_MAX_AGE_HOURS: '48'
  SOLO_OUTPUT_ROOT: apps/web/public/data
  TEAMPLAY_OUTPUT_ROOT: apps/web/public/data/teamplay
  DATA_REGIONS: 'na lan las'
  DATA_TIERS: 'iron bronze silver gold platinum emerald diamond master'
  DATA_WINDOWS: 'current 7d 14d'
  DATA_LANES: 'top jungle middle bottom support'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            tools/scraper/pyproject.toml
            tools/scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "tools/scraper[oracle-download]"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore validated Oracle cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/oracle-cache
          key: oracle-production-2026-${{ github.run_id }}
          restore-keys: |
            oracle-production-2026-

      - name: Resolve Oracle's Elixir CSV
        id: oracle_download
        run: |
          mkdir -p "${RUNNER_TEMP}/oracle-download"
          python -m loltee_scraper.oracle_download \
            --file-id "$ORACLE_FILE_ID" \
            --output "$ORACLE_CSV_PATH" \
            --metadata "${RUNNER_TEMP}/oracle-download/metadata.json" \
            --cache "${RUNNER_TEMP}/oracle-cache/2026.csv" \
            --cache-max-age-hours "$ORACLE_CACHE_MAX_AGE_HOURS" \
            --require-production-current

      - name: Summarize Oracle resolution
        if: always()
        run: |
          python - "${RUNNER_TEMP}/oracle-download/metadata.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          print("## Oracle production data")
          if not path.is_file():
              print("Oracle resolution did not produce metadata.")
              raise SystemExit(0)
          metadata = json.loads(path.read_text(encoding="utf-8"))
          def age(value):
              return "unknown" if value is None else f"{value / 3600:.1f} hours"
          print(f"- **State/source:** `{metadata['state']}` / `{metadata['source']}`")
          print(f"- **Downloaded at:** `{metadata.get('downloaded_at')}`")
          print(f"- **Download age:** `{age(metadata.get('download_age_seconds'))}`")
          print(f"- **Last match at:** `{metadata.get('last_match_at')}`")
          print(f"- **Match-data age:** `{age(metadata.get('data_age_seconds'))}`")
          print(f"- **Content changed:** `{metadata.get('content_changed')}`")
          PY

      - name: Save newly validated Oracle cache
        if: steps.oracle_download.outputs.cache_updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/oracle-cache
          key: oracle-production-2026-${{ github.run_id }}

      - name: Generate Solo Queue datasets
        run: |
          python -m loltee_scraper.run_matrix \
            --output-root "$SOLO_OUTPUT_ROOT" \
            --regions $DATA_REGIONS \
            --tiers $DATA_TIERS \
            --windows $DATA_WINDOWS \
            --lanes $DATA_LANES \
            --fail-fast

      - name: Generate Teamplay datasets
        run: |
          python -m loltee_scraper.build_teamplay \
            --oe-csv "$ORACLE_CSV_PATH" \
            --solo-root "$SOLO_OUTPUT_ROOT" \
            --output-root "$TEAMPLAY_OUTPUT_ROOT" \
            --regions $DATA_REGIONS \
            --tiers $DATA_TIERS \
            --windows $DATA_WINDOWS \
            --oracle-metadata "${RUNNER_TEMP}/oracle-download/metadata.json" \
            --fail-fast

      - name: Add Teamplay patches to workflow summary
        run: |
          python - "$TEAMPLAY_OUTPUT_ROOT" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          dataset = next(Path(sys.argv[1]).glob("*/*/*.json"))
          patches = json.loads(dataset.read_text(encoding="utf-8"))["meta"]["patches_used"]
          print(f"- **Patches used:** `{', '.join(patches)}`")
          PY

      - name: Verify Teamplay datasets exist
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["TEAMPLAY_OUTPUT_ROOT"])
          regions = os.environ["DATA_REGIONS"].split()
          tiers = os.environ["DATA_TIERS"].split()
          windows = os.environ["DATA_WINDOWS"].split()
          missing = [
              str(root / region / tier / f"{window}.json")
              for region in regions
              for tier in tiers
              for window in windows
              if not (root / region / tier / f"{window}.json").is_file()
          ]
          if missing:
              raise SystemExit(f"Missing {len(missing)} Teamplay datasets; examples={missing[:5]}")
          print(f"Verified {len(regions) * len(tiers) * len(windows)} Teamplay datasets.")
          PY

      - name: Upload generated data artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-data-preview
          path: apps/web/public/data
          retention-days: 7
