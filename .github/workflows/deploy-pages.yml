name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'
    - cron: '23 12 * * *'

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  ORACLE_FILE_ID: '1hnpbrUpBMS1TZI7IovfpKeZfWJH1Aptm'
  ORACLE_CSV_PATH: tools/scraper/data/raw/oracles_elixir/2026/2026_LoL_esports_match_data_from_OraclesElixir.csv
  ORACLE_CACHE_MAX_AGE_HOURS: '48'
  SOLO_OUTPUT_ROOT: apps/web/public/data
  TEAMPLAY_OUTPUT_ROOT: apps/web/public/data/teamplay
  DATA_REGIONS: 'na lan las'
  DATA_TIERS: 'iron bronze silver gold platinum emerald diamond master'
  DATA_WINDOWS: 'current 7d 14d'
  DATA_LANES: 'top jungle middle bottom support'
  PRODUCTION_DATA_ARTIFACT: production-data-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  prepare-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      refreshed: ${{ steps.data_source.outputs.refresh }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select production data source
        id: data_source
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          refresh=true
          reason="${EVENT_NAME} requires a full refresh"

          if [[ "$EVENT_NAME" == "push" ]]; then
            data_sensitive=false
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}"; then
              data_sensitive=true
              reason="the previous main commit is unavailable"
            else
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
              while IFS= read -r path; do
                case "$path" in
                  tools/scraper/*|\
                  .github/workflows/deploy-pages.yml|\
                  .github/scripts/validate-production-data.py|\
                  apps/web/src/app/core/models/tierlist.model.ts|\
                  apps/web/src/app/core/services/tierlist.service.ts)
                    data_sensitive=true
                    reason="main changed the production data contract ($path)"
                    break
                    ;;
                esac
              done <<< "$changed_files"
            fi

            if [[ "$data_sensitive" == "false" ]]; then
              set +e
              git ls-remote --exit-code --heads origin production-data > "${RUNNER_TEMP}/production-data-ref"
              lookup_status=$?
              set -e

              if [[ "$lookup_status" == "0" ]]; then
                snapshot_root="${RUNNER_TEMP}/production-data-snapshot"
                mkdir -p "$snapshot_root"
                if git fetch --no-tags origin production-data:refs/remotes/origin/production-data && \
                  git archive refs/remotes/origin/production-data data | tar -x -C "$snapshot_root"; then
                  if python3 .github/scripts/validate-production-data.py \
                    --root "$snapshot_root/data" \
                    --regions $DATA_REGIONS \
                    --tiers $DATA_TIERS \
                    --windows $DATA_WINDOWS \
                    --lanes $DATA_LANES; then
                    rm -rf "$SOLO_OUTPUT_ROOT"
                    mkdir -p "$SOLO_OUTPUT_ROOT"
                    cp -a "$snapshot_root/data/." "$SOLO_OUTPUT_ROOT/"
                    refresh=false
                    reason="the validated production-data snapshot is reusable"
                  else
                    reason="the production-data snapshot is invalid"
                  fi
                else
                  reason="the production-data snapshot could not be restored"
                fi
              elif [[ "$lookup_status" == "2" ]]; then
                reason="the production-data branch does not exist yet"
              else
                reason="the production-data branch could not be queried"
              fi
            fi
          fi

          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
          {
            echo "## Production data selection"
            echo "- **Full refresh:** \`$refresh\`"
            echo "- **Reason:** $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clear stale production data before refresh
        if: steps.data_source.outputs.refresh == 'true'
        run: rm -rf "$SOLO_OUTPUT_ROOT"

      - name: Setup Python
        if: steps.data_source.outputs.refresh == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            tools/scraper/pyproject.toml
            tools/scraper/requirements.txt

      - name: Install Python dependencies
        if: steps.data_source.outputs.refresh == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e "tools/scraper[oracle-download]"

      - name: Install Playwright Chromium
        if: steps.data_source.outputs.refresh == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Restore validated Oracle cache
        if: steps.data_source.outputs.refresh == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/oracle-cache
          key: oracle-production-2026-${{ github.run_id }}
          restore-keys: |
            oracle-production-2026-

      - name: Resolve Oracle's Elixir CSV
        if: steps.data_source.outputs.refresh == 'true'
        id: oracle_download
        run: |
          mkdir -p "${RUNNER_TEMP}/oracle-download"
          python -m loltee_scraper.oracle_download \
            --file-id "$ORACLE_FILE_ID" \
            --output "$ORACLE_CSV_PATH" \
            --metadata "${RUNNER_TEMP}/oracle-download/metadata.json" \
            --cache "${RUNNER_TEMP}/oracle-cache/2026.csv" \
            --cache-max-age-hours "$ORACLE_CACHE_MAX_AGE_HOURS" \
            --require-production-current

      - name: Summarize Oracle resolution
        if: always() && steps.data_source.outputs.refresh == 'true'
        run: |
          python - "${RUNNER_TEMP}/oracle-download/metadata.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          print("## Oracle production data")
          if not path.is_file():
              print("Oracle resolution did not produce metadata.")
              raise SystemExit(0)
          metadata = json.loads(path.read_text(encoding="utf-8"))
          def age(value):
              return "unknown" if value is None else f"{value / 3600:.1f} hours"
          print(f"- **State/source:** `{metadata['state']}` / `{metadata['source']}`")
          print(f"- **Downloaded at:** `{metadata.get('downloaded_at')}`")
          print(f"- **Download age:** `{age(metadata.get('download_age_seconds'))}`")
          print(f"- **Last match at:** `{metadata.get('last_match_at')}`")
          print(f"- **Match-data age:** `{age(metadata.get('data_age_seconds'))}`")
          print(f"- **Content changed:** `{metadata.get('content_changed')}`")
          PY

      - name: Save newly validated Oracle cache
        if: steps.oracle_download.outputs.cache_updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/oracle-cache
          key: oracle-production-2026-${{ github.run_id }}

      - name: Load difficulty history for scoring
        if: steps.data_source.outputs.refresh == 'true'
        env:
          HISTORY_FILE: ${{ runner.temp }}/difficulty-history.json
        run: |
          set -euo pipefail

          set +e
          git ls-remote --exit-code --heads origin difficulty-history > "${RUNNER_TEMP}/difficulty-history-scoring-ref"
          lookup_status=$?
          set -e

          case "$lookup_status" in
            0)
              git fetch --no-tags origin difficulty-history
              if git cat-file -e FETCH_HEAD:difficulty-history.json 2>/dev/null; then
                git show FETCH_HEAD:difficulty-history.json > "$HISTORY_FILE"
                echo "Loaded difficulty history for read-only scoring."
              else
                echo "Difficulty history branch has no state file; using snapshot fallback."
              fi
              ;;
            2)
              echo "Difficulty history branch does not exist; using snapshot fallback."
              ;;
            *)
              echo "Unable to determine whether the difficulty-history branch exists." >&2
              exit "$lookup_status"
              ;;
          esac

      - name: Generate Solo Queue datasets
        if: steps.data_source.outputs.refresh == 'true'
        env:
          HISTORY_FILE: ${{ runner.temp }}/difficulty-history.json
        run: |
          history_args=()
          if [[ -f "$HISTORY_FILE" ]]; then
            history_args=(--difficulty-history-file "$HISTORY_FILE")
          fi

          python -m loltee_scraper.run_matrix \
            --output-root "$SOLO_OUTPUT_ROOT" \
            --regions $DATA_REGIONS \
            --tiers $DATA_TIERS \
            --windows $DATA_WINDOWS \
            --lanes $DATA_LANES \
            "${history_args[@]}" \
            --fail-fast

      - name: Upload Solo matrix for difficulty history
        if: ${{ steps.data_source.outputs.refresh == 'true' && github.event_name == 'schedule' && github.event.schedule == '23 0 * * *' }}
        uses: actions/upload-artifact@v4
        with:
          name: difficulty-history-solo-matrix
          path: |
            apps/web/public/data/*/*/*.json
            !apps/web/public/data/*/*/*.last_success.json
          if-no-files-found: error
          retention-days: 1

      - name: Generate Teamplay datasets
        if: steps.data_source.outputs.refresh == 'true'
        run: |
          python -m loltee_scraper.build_teamplay \
            --oe-csv "$ORACLE_CSV_PATH" \
            --solo-root "$SOLO_OUTPUT_ROOT" \
            --output-root "$TEAMPLAY_OUTPUT_ROOT" \
            --regions $DATA_REGIONS \
            --tiers $DATA_TIERS \
            --windows $DATA_WINDOWS \
            --oracle-metadata "${RUNNER_TEMP}/oracle-download/metadata.json" \
            --fail-fast

      - name: Add Teamplay patches to workflow summary
        if: steps.data_source.outputs.refresh == 'true'
        run: |
          python - "$TEAMPLAY_OUTPUT_ROOT" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          dataset = next(Path(sys.argv[1]).glob("*/*/*.json"))
          patches = json.loads(dataset.read_text(encoding="utf-8"))["meta"]["patches_used"]
          print(f"- **Patches used:** `{', '.join(patches)}`")
          PY

      - name: Validate selected production data
        run: |
          python3 .github/scripts/validate-production-data.py \
            --root "$SOLO_OUTPUT_ROOT" \
            --regions $DATA_REGIONS \
            --tiers $DATA_TIERS \
            --windows $DATA_WINDOWS \
            --lanes $DATA_LANES

      - name: Upload validated production data
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCTION_DATA_ARTIFACT }}
          path: apps/web/public/data
          if-no-files-found: error
          retention-days: 1

  persist-production-data:
    runs-on: ubuntu-latest
    needs: prepare-data
    if: needs.prepare-data.outputs.refreshed == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated production data
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PRODUCTION_DATA_ARTIFACT }}
          path: ${{ runner.temp }}/production-data

      - name: Revalidate production data before persistence
        run: |
          python3 .github/scripts/validate-production-data.py \
            --root "${RUNNER_TEMP}/production-data" \
            --regions $DATA_REGIONS \
            --tiers $DATA_TIERS \
            --windows $DATA_WINDOWS \
            --lanes $DATA_LANES

      - name: Commit validated snapshot only when changed
        env:
          SNAPSHOT_ROOT: ${{ runner.temp }}/production-data
        run: |
          set -euo pipefail

          set +e
          git ls-remote --exit-code --heads origin production-data > "${RUNNER_TEMP}/production-data-persist-ref"
          lookup_status=$?
          set -e

          case "$lookup_status" in
            0)
              git fetch --no-tags origin production-data
              git switch -C production-data FETCH_HEAD
              ;;
            2)
              git switch --orphan production-data
              ;;
            *)
              echo "Unable to determine whether the production-data branch exists." >&2
              exit "$lookup_status"
              ;;
          esac

          git rm -r --ignore-unmatch .
          mkdir -p data
          cp -a "$SNAPSHOT_ROOT/." data/
          git add data

          if git diff --cached --quiet; then
            echo "Production data snapshot is already current; no commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update production data"
          git push origin HEAD:production-data

  build:
    runs-on: ubuntu-latest
    needs: [prepare-data, persist-production-data]
    if: ${{ always() && !cancelled() && needs.prepare-data.result == 'success' && (needs.persist-production-data.result == 'success' || needs.persist-production-data.result == 'skipped') }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download selected production data
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PRODUCTION_DATA_ARTIFACT }}
          path: apps/web/public/data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Resolve Pages base href
        id: base_href
        run: |
          if [[ "${{ github.event.repository.name }}" == "${{ github.repository_owner }}.github.io" ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Angular app
        working-directory: apps/web
        run: npm run build -- --configuration production --base-href "${{ steps.base_href.outputs.value }}"

      - name: Resolve build output
        id: output
        working-directory: apps/web
        run: |
          output_path="$(find dist -type f -path '*/browser/index.html' -print | head -n 1)"
          if [[ -z "$output_path" ]]; then
            output_path="$(find dist -type f -name index.html -print | head -n 1)"
          fi

          if [[ -z "$output_path" ]]; then
            echo "Unable to locate Angular build output under apps/web/dist" >&2
            exit 1
          fi

          echo "path=$(dirname "$output_path")" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/${{ steps.output.outputs.path }}

  persist-difficulty-history:
    runs-on: ubuntu-latest
    needs: prepare-data
    if: ${{ always() && github.event_name == 'schedule' && github.event.schedule == '23 0 * * *' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download complete Solo matrix
        uses: actions/download-artifact@v4
        with:
          name: difficulty-history-solo-matrix
          path: ${{ runner.temp }}/difficulty-history-solo-data

      - name: Load existing difficulty history
        id: history_state
        env:
          HISTORY_FILE: ${{ runner.temp }}/difficulty-history.json
        run: |
          set -euo pipefail

          set +e
          git ls-remote --exit-code --heads origin difficulty-history > "${RUNNER_TEMP}/difficulty-history-ref"
          lookup_status=$?
          set -e

          case "$lookup_status" in
            0)
              git fetch --no-tags origin difficulty-history
              if git cat-file -e FETCH_HEAD:difficulty-history.json 2>/dev/null; then
                git show FETCH_HEAD:difficulty-history.json > "$HISTORY_FILE"
              fi
              echo "branch_exists=true" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "branch_exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unable to determine whether the difficulty-history branch exists." >&2
              exit "$lookup_status"
              ;;
          esac

      - name: Merge daily Solo observations
        env:
          HISTORY_FILE: ${{ runner.temp }}/difficulty-history.json
          SOLO_HISTORY_ROOT: ${{ runner.temp }}/difficulty-history-solo-data
          PYTHONPATH: tools/scraper/src
        run: |
          python -m loltee_scraper.difficulty_history \
            --history-file "$HISTORY_FILE" \
            --data-root "$SOLO_HISTORY_ROOT" \
            --regions $DATA_REGIONS \
            --tiers $DATA_TIERS \
            --windows $DATA_WINDOWS \
            --lanes $DATA_LANES \
            --date "$(date -u +%F)"

      - name: Commit history only when changed
        env:
          BRANCH_EXISTS: ${{ steps.history_state.outputs.branch_exists }}
          HISTORY_FILE: ${{ runner.temp }}/difficulty-history.json
        run: |
          set -euo pipefail

          if [[ "$BRANCH_EXISTS" == "true" ]]; then
            git switch -C difficulty-history FETCH_HEAD
          else
            git switch --orphan difficulty-history
          fi

          cp "$HISTORY_FILE" difficulty-history.json
          git add difficulty-history.json
          if git diff --cached --quiet; then
            echo "Difficulty history is already current; no commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update difficulty history"
          git push origin HEAD:difficulty-history

  deploy:
    runs-on: ubuntu-latest
    needs: [build, persist-difficulty-history]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
