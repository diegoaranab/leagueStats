name: Validate Authenticated Oracle Download

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-oracle-download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve and validate official Oracle CSV
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          PYTHONPATH: tools/scraper/src
        run: |
          python -m loltee_scraper.oracle_drive_api \
            --metadata "${RUNNER_TEMP}/oracle-download/metadata.json"

      - name: Report diagnostic results
        if: always()
        run: |
          metadata="${RUNNER_TEMP}/oracle-download/metadata.json"
          if [[ ! -f "$metadata" ]]; then
            echo "Authenticated Oracle diagnostic failed; metadata was not produced." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python - "$metadata" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              metadata = json.load(handle)
          print("## Authenticated Oracle CSV validation")
          for key in (
              "source", "file_id", "file_name", "drive_modified_time", "drive_version",
              "drive_size", "local_size", "md5_verified", "sha256", "row_count",
              "valid_record_count", "game_count", "last_match_at",
          ):
              print(f"- **{key}:** `{metadata.get(key)}`")
          PY

      - name: Upload validation metadata
        uses: actions/upload-artifact@v4
        with:
          name: oracle-download-validation-metadata
          path: ${{ runner.temp }}/oracle-download/metadata.json
          if-no-files-found: error
          retention-days: 14
