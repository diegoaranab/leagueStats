<section class="onboarding-page">
  <div class="hero-copy">
    <p class="eyebrow">Context-Aware Pick Guidance</p>
    <h1>Find stronger picks for the way you play.</h1>
    <p class="hero-description meta-text">
      Choose your queue and context, then scan recommendations built for your games.
    </p>
  </div>

  <section class="setup-card surface-panel" aria-labelledby="setup-title">
    <header class="setup-card__header">
      <div>
        <p class="eyebrow">Choose mode</p>
        <h2 id="setup-title">Set up your tier list</h2>
      </div>
    </header>

    <app-mode-selector
      [selectedMode]="form.controls.mode.value"
      (modeChange)="form.controls.mode.setValue($event)"
    ></app-mode-selector>

    <form [formGroup]="form" (ngSubmit)="submit()" class="setup-form">
      <h3>Choose context</h3>
      <div class="selector-grid">
        <mat-form-field appearance="outline">
          <mat-label>Region</mat-label>
          <mat-select formControlName="region">
            <mat-option *ngFor="let region of regionOptions" [value]="region">
              {{ regionLabels[region] }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Rank</mat-label>
          <mat-select formControlName="tier">
            <mat-option *ngFor="let tier of tierOptions" [value]="tier">
              {{ tierLabels[tier] }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Window</mat-label>
          <mat-select formControlName="window">
            <mat-option *ngFor="let window of windowOptions" [value]="window">
              {{ windowLabels[window] }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <button mat-flat-button color="primary" type="submit" class="cta-button">
        View recommendations
      </button>
    </form>
  </section>
</section>
