<section class="onboarding-page">
  <h1>Set up your picks</h1>
  <section class="setup" aria-label="Recommendation setup">
    <h2 id="queue-label">Queue</h2>
    <app-mode-selector
      [selectedMode]="form.controls.mode.value"
      (modeChange)="form.controls.mode.setValue($event)"
    ></app-mode-selector>

    <form [formGroup]="form" (ngSubmit)="submit()" class="setup-form">

      <div class="selector-grid">
        <mat-form-field appearance="outline">
          <mat-label>Region</mat-label>
          <mat-select formControlName="region">
            @for (region of regionOptions; track region) {
              <mat-option [value]="region">
                {{ regionLabels[region] }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Rank</mat-label>
          <mat-select formControlName="tier">
            @for (tier of tierOptions; track tier) {
              <mat-option [value]="tier">
                {{ tierLabels[tier] }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Window</mat-label>
          <mat-select formControlName="window">
            @for (window of windowOptions; track window) {
              <mat-option [value]="window">
                {{ windowLabels[window] }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <button mat-flat-button color="primary" type="submit" class="cta-button">
        View recommendations
      </button>
    </form>
  </section>
</section>
