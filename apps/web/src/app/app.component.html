<div class="app-shell">
  <mat-toolbar class="topbar">
    <a class="brand-wrap" routerLink="/">
      <span class="brand-mark">LS</span>
      <span class="brand-copy">
        <small class="brand-kicker">League of Legends</small>
        <span class="brand">LeagueStats</span>
      </span>
    </a>

    <nav class="toolbar-nav" aria-label="Primary">
      <a
        mat-button
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>
      <a
        mat-flat-button
        color="primary"
        routerLink="/results"
        routerLinkActive="is-active"
      >
        Results
      </a>
    </nav>
  </mat-toolbar>

  <div class="app-layout">
    <aside class="nav-rail" aria-label="Sections">
      <a
        class="nav-item"
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="material-symbols-outlined">home</span>
        <span class="nav-copy">
          <strong>Home</strong>
          <small>Start with your mode</small>
        </span>
      </a>

      <a
        class="nav-item"
        routerLink="/results"
        routerLinkActive="is-active"
      >
        <span class="material-symbols-outlined">stacked_bar_chart</span>
        <span class="nav-copy">
          <strong>Results</strong>
          <small>Scan picks by lane</small>
        </span>
      </a>
    </aside>

    <main class="shell">
      <router-outlet></router-outlet>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <a
      class="mobile-nav__item"
      routerLink="/"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="material-symbols-outlined">home</span>
      <span>Home</span>
    </a>

    <a
      class="mobile-nav__item"
      routerLink="/results"
      routerLinkActive="is-active"
    >
      <span class="material-symbols-outlined">stacked_bar_chart</span>
      <span>Results</span>
    </a>
  </nav>
</div>
