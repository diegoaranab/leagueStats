<div class="app-shell">
  <button class="skip-link" type="button" (click)="skipToMain(mainContent)">Skip to main content</button>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand-wrap" routerLink="/" [queryParams]="resultsContext()"
        routerLinkActive="current-home" [routerLinkActiveOptions]="routeMatchOptions" ariaCurrentWhenActive="page">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        LeagueStats
      </a>

      @if (resultsContext(); as query) {
        <nav class="toolbar-nav" aria-label="Queue">
          @for (mode of modes; track mode) {
            <a routerLink="/results" [queryParams]="queueQuery(query, mode)"
              [attr.aria-current]="query.mode === mode ? 'page' : null">{{ modeDetails[mode].shortLabel }}</a>
          }
        </nav>
      } @else {
        <span class="header-note">League of Legends</span>
      }
    </div>
  </header>
  <main #mainContent class="shell" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
</div>
