<div class="app-shell">
  <mat-toolbar class="topbar">
    <a class="brand-wrap" routerLink="/">
      <span class="brand-mark">LS</span>
      <span class="brand-copy">
        <small class="brand-kicker">League of Legends</small>
        <span class="brand">LeagueStats</span>
      </span>
    </a>

    <nav class="toolbar-nav" aria-label="Primary">
      <a
        mat-button
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>
      <a
        mat-flat-button
        color="primary"
        routerLink="/results"
        routerLinkActive="is-active"
      >
        Results
      </a>
    </nav>
  </mat-toolbar>

  <div class="app-layout">
    <main class="shell">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
