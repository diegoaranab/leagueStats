<div class="app-shell">
  <button class="skip-link" type="button" (click)="skipToMain(mainContent)">Skip to main content</button>
  <mat-toolbar class="topbar">
    <a class="brand-wrap" routerLink="/">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-copy">
        <small class="brand-kicker">League of Legends</small>
        <span class="brand">LeagueStats</span>
      </span>
    </a>

    <nav class="toolbar-nav" aria-label="Primary">
      <a
        mat-button
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="routeMatchOptions"
        ariaCurrentWhenActive="page"
      >
        Home
      </a>
      <a
        mat-button
        routerLink="/results"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="routeMatchOptions"
        ariaCurrentWhenActive="page"
      >
        Results
      </a>
    </nav>
  </mat-toolbar>

  <div class="app-layout">
    <main #mainContent class="shell" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
