<div class="lane-scroll">
  <mat-button-toggle-group
    class="lane-group"
    aria-label="Choose a lane"
    [value]="selectedLane"
    (change)="laneChange.emit($event.value)"
    >
    @for (lane of lanes; track lane) {
      <mat-button-toggle [value]="lane">
        <span class="lane-copy">
          <span class="lane-label">{{ laneLabels[lane] }}</span>
          <small>{{ laneCounts[lane] ?? 0 }} picks</small>
        </span>
      </mat-button-toggle>
    }
  </mat-button-toggle-group>
</div>
