<div class="mode-selector" [attr.role]="variant === 'compact' ? 'group' : null" [attr.aria-label]="variant === 'compact' ? 'Mode' : null">
  @for (mode of modes; track mode) {
    <button type="button" class="mode-option" [attr.aria-pressed]="mode === selectedMode"
      (click)="modeChange.emit(mode)">
      <span class="selection-mark" aria-hidden="true"></span>
      <span>
        <strong>{{ modeDetails[mode].label }}</strong>
        <small>{{ mode === 'solo' ? 'Ranked ladder picks and bans.' : 'Draft picks, bans and team lineup.' }}</small>
      </span>
    </button>
  }
</div>
